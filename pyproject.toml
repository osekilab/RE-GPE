[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "re-gpe"
version = "0.1.0"
description = "Natural Stories & Garden-Path Effects: Psycholinguistic Modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "wordfreq>=3.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
    "scikit-learn>=1.7.0",
    # Reverse-engineering dependencies
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.5",
    "rpy2>=3.6.1",
    "pyreadr>=0.5.3",
    "jsonlines>=4.0.0",
    "spacy>=3.8.7",
    "stanza>=1.11.0",
    "cosine-annealing-warmup",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.280",
    "pyright>=1.1.320",
    "pre-commit>=3.3.0",
]
blimp = [
    "lm-eval==0.4.9.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "ruff>=0.12.3",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0912", # too many branches
    "PLR0911", # too many return statements
    "C408", # unnecessary dict call
    "PLC0415", # import should be at top level (sometimes needed in functions)
    "PLR2004", # magic value comparison (sometimes appropriate)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]
"notebooks/**/*.py" = ["E402", "T201"]
"scripts/**/*.py" = ["T201", "S603", "S607"]
"src/garden_path_cross_validation/**/*.py" = ["E402", "F841", "B007"]  # Analysis scripts can be less strict

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "external/",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.uv.sources]
cosine-annealing-warmup = { git = "https://github.com/katsura-jp/pytorch-cosine-annealing-with-warmup", rev = "12d03c07553aedd3d9e9155e2b3e31ce8c64081a" }
